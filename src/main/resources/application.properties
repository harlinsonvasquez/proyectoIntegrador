spring.application.name=proyectoIntegrador

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:gestion_estudiantil}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=gestion_estudiantil

# Bases nuevas ejecutan V1 y luego V2. En bases preexistentes sin historial de
# Flyway, se registra V1 como baseline y se aplican únicamente migraciones nuevas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema inicial existente
spring.flyway.default-schema=gestion_estudiantil
spring.flyway.schemas=gestion_estudiantil
spring.flyway.create-schemas=true

# Firebase Authentication y Realtime Database del proyecto configurado.
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:${user.home}/.config/firebase/firebase_key.json}
firebase.project-id=${FIREBASE_PROJECT_ID:base-datos-8eff6}
firebase.database-url=${FIREBASE_DATABASE_URL:https://base-datos-8eff6-default-rtdb.firebaseio.com/}
firebase.outbox-delay-ms=${FIREBASE_OUTBOX_DELAY_MS:5000}
